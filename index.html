<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>骑车的鹈鹕 · 单文件</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 16px;
    padding: 26px 18px 30px;
    background:
      radial-gradient(900px 460px at 50% -10%, #24405e 0%, rgba(36,64,94,0) 62%),
      linear-gradient(180deg, #0d1722 0%, #070d14 74%);
    color: #dbe7f2;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .wrap { width: 100%; max-width: 1060px; }
  .frame {
    padding: 10px;
    border-radius: 22px;
    background: linear-gradient(155deg, rgba(255,255,255,.17), rgba(255,255,255,.03) 42%, rgba(255,255,255,.10));
    box-shadow: 0 42px 90px -32px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08) inset;
  }
  svg {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .caption {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 14px;
    margin-top: 12px;
    padding: 0 6px;
    font-size: 13px;
    color: #8ea6bd;
  }
  .caption b { color: #dcebf8; font-weight: 600; letter-spacing: .05em; }
  .hint { font-variant-numeric: tabular-nums; }

  /* 背景无限滚动 */
  @keyframes cloudDrift { from { transform: translateX(0); } to { transform: translateX(900px); } }
  @keyframes roadScroll { from { transform: translateX(0); } to { transform: translateX(-200px); } }
  @keyframes waveScroll { from { transform: translateX(0); } to { transform: translateX(-44px); } }
  @keyframes boatBob {
    0%, 100% { transform: translateY(0) rotate(-1.6deg); }
    50%      { transform: translateY(-3px) rotate(1.4deg); }
  }
  .cloud-track { animation: cloudDrift 160s linear infinite; }
  .road-track  { animation: roadScroll .58s linear infinite; }
  .wave-track  { animation: waveScroll 2.4s linear infinite; }
  .boat        { animation: boatBob 4.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 90%; }

  body.is-paused .cloud-track,
  body.is-paused .road-track,
  body.is-paused .wave-track,
  body.is-paused .boat { animation-play-state: paused; }

  @media (prefers-reduced-motion: reduce) {
    .cloud-track, .road-track, .wave-track, .boat { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="frame">
    <svg id="scene" viewBox="0 0 900 620" role="img"
         aria-label="一只鹈鹕骑着自行车，沿着海边的公路前行">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#a9d6ef"/>
          <stop offset=".52" stop-color="#ddedf8"/>
          <stop offset="1" stop-color="#fdf1dd"/>
        </linearGradient>
        <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fff0b8" stop-opacity=".95"/>
          <stop offset=".55" stop-color="#ffeda6" stop-opacity=".32"/>
          <stop offset="1" stop-color="#ffeda6" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6fc3d4"/>
          <stop offset=".45" stop-color="#45a4bd"/>
          <stop offset="1" stop-color="#277f9c"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#727d8a"/>
          <stop offset=".35" stop-color="#5a646f"/>
          <stop offset="1" stop-color="#343d47"/>
        </linearGradient>
        <linearGradient id="body" x1=".1" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset=".62" stop-color="#f3f7fa"/>
          <stop offset="1" stop-color="#d7e2ea"/>
        </linearGradient>
        <linearGradient id="neckG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff"/>
          <stop offset="1" stop-color="#e8f0f6"/>
        </linearGradient>
        <linearGradient id="wing" x1=".1" y1="0" x2=".5" y2="1">
          <stop offset="0" stop-color="#eef4f8"/>
          <stop offset="1" stop-color="#c2d1dc"/>
        </linearGradient>
        <linearGradient id="beak" x1="0" y1="0" x2="1" y2=".7">
          <stop offset="0" stop-color="#ffcd72"/>
          <stop offset="1" stop-color="#ee9a26"/>
        </linearGradient>
        <linearGradient id="pouch" x1=".2" y1="0" x2=".7" y2="1">
          <stop offset="0" stop-color="#ffdda0"/>
          <stop offset=".6" stop-color="#ffc267"/>
          <stop offset="1" stop-color="#ee9a2b"/>
        </linearGradient>

        <g id="cloudSet" fill="#ffffff">
          <g opacity=".92">
            <ellipse cx="148" cy="124" rx="56" ry="17"/>
            <ellipse cx="118" cy="112" rx="33" ry="20"/>
            <ellipse cx="178" cy="110" rx="38" ry="22"/>
          </g>
          <g opacity=".78">
            <ellipse cx="528" cy="84" rx="46" ry="13"/>
            <ellipse cx="504" cy="75" rx="26" ry="15"/>
            <ellipse cx="552" cy="74" rx="29" ry="16"/>
          </g>
          <g opacity=".86">
            <ellipse cx="784" cy="172" rx="58" ry="15"/>
            <ellipse cx="756" cy="162" rx="32" ry="17"/>
            <ellipse cx="812" cy="160" rx="34" ry="18"/>
          </g>
        </g>
      </defs>

      <!-- 天空 -->
      <rect width="900" height="620" fill="url(#sky)"/>
      <circle cx="742" cy="116" r="150" fill="url(#sunGlow)"/>
      <circle cx="742" cy="116" r="46" fill="#fff6d2"/>
      <circle cx="742" cy="116" r="46" fill="none" stroke="#ffe8a4" stroke-width="2"/>

      <!-- 云 -->
      <g class="cloud-track">
        <use href="#cloudSet"/>
        <use href="#cloudSet" x="-900"/>
      </g>

      <!-- 海鸥 -->
      <g fill="none" stroke="#5b7484" stroke-width="2.2" stroke-linecap="round" opacity=".55">
        <path d="M272 128 q6 -7 12 0 q6 -7 12 0"/>
        <path d="M330 160 q5 -6 10 0 q5 -6 10 0"/>
      </g>

      <!-- 远山 -->
      <path d="M0 306 C 58 284 118 284 176 300 C 232 316 268 298 320 286 C 366 275 410 294 462 298
               C 520 303 556 280 610 276 C 668 271 706 294 760 298 C 812 302 860 286 900 274
               L900 340 L0 340 Z" fill="#b2cfc0"/>
      <path d="M0 326 C 70 312 128 315 186 325 C 244 335 296 325 352 318 C 410 311 452 330 512 332
               C 570 334 610 320 668 318 C 726 316 782 330 840 328 C 866 327 886 322 900 318
               L900 344 L0 344 Z" fill="#93bda7"/>

      <!-- 海 -->
      <rect x="0" y="338" width="900" height="120" fill="url(#sea)"/>
      <rect x="0" y="338" width="900" height="3" fill="#eaf9ff" opacity=".55"/>
      <g class="wave-track" fill="none" stroke="#d8f2fb" stroke-linecap="round" opacity=".5">
        <line x1="-60" y1="358" x2="960" y2="358" stroke-width="2.4" stroke-dasharray="18 26"/>
        <line x1="-60" y1="390" x2="960" y2="390" stroke-width="2.6" stroke-dasharray="18 26" stroke-dashoffset="12"/>
        <line x1="-60" y1="424" x2="960" y2="424" stroke-width="3" stroke-dasharray="18 26" stroke-dashoffset="24"/>
      </g>
      <!-- 帆船 -->
      <g transform="translate(688 372)">
        <g class="boat">
          <path d="M12 0 L12 34 L34 34 Z" fill="#fbfdff"/>
          <path d="M8 0 L8 34 L0 34 Z" fill="#e4eff7"/>
          <path d="M-6 34 L40 34 L34 43 L0 43 Z" fill="#8a5a3b"/>
        </g>
      </g>

      <!-- 公路 -->
      <rect x="0" y="456" width="900" height="164" fill="url(#road)"/>
      <rect x="0" y="456" width="900" height="4" fill="#e6eef4" opacity=".35"/>
      <g class="road-track">
        <g fill="#eaf2f7" opacity=".5">
          <rect x="-200" y="534" width="112" height="8" rx="4"/>
          <rect x="0" y="534" width="112" height="8" rx="4"/>
          <rect x="200" y="534" width="112" height="8" rx="4"/>
          <rect x="400" y="534" width="112" height="8" rx="4"/>
          <rect x="600" y="534" width="112" height="8" rx="4"/>
          <rect x="800" y="534" width="112" height="8" rx="4"/>
          <rect x="1000" y="534" width="112" height="8" rx="4"/>
        </g>
      </g>

      <!-- 车影 -->
      <ellipse cx="420" cy="477" rx="158" ry="11" fill="#101d26" opacity=".14"/>
      <ellipse cx="318" cy="474" rx="42" ry="7" fill="#101d26" opacity=".2"/>
      <ellipse cx="516" cy="474" rx="42" ry="7" fill="#101d26" opacity=".2"/>

      <g id="bike">
        <!-- 后轮 -->
        <g>
          <circle cx="318" cy="404" r="62" fill="none" stroke="#242e36" stroke-width="9"/>
          <circle cx="318" cy="404" r="53" fill="none" stroke="#d3e0ea" stroke-width="2.5" opacity=".9"/>
          <g id="spokesRear" stroke="#c9d8e4" stroke-width="1.4" opacity=".8">
            <line x1="318" y1="354" x2="318" y2="454"/>
            <line x1="318" y1="354" x2="318" y2="454" transform="rotate(30 318 404)"/>
            <line x1="318" y1="354" x2="318" y2="454" transform="rotate(60 318 404)"/>
            <line x1="318" y1="354" x2="318" y2="454" transform="rotate(90 318 404)"/>
            <line x1="318" y1="354" x2="318" y2="454" transform="rotate(120 318 404)"/>
            <line x1="318" y1="354" x2="318" y2="454" transform="rotate(150 318 404)"/>
            <circle cx="318" cy="352" r="3.2" fill="#ff9068" stroke="none"/>
          </g>
          <circle cx="318" cy="404" r="7" fill="#93a6b4"/>
        </g>

        <!-- 前轮 -->
        <g>
          <circle cx="516" cy="404" r="62" fill="none" stroke="#242e36" stroke-width="9"/>
          <circle cx="516" cy="404" r="53" fill="none" stroke="#d3e0ea" stroke-width="2.5" opacity=".9"/>
          <g id="spokesFront" stroke="#c9d8e4" stroke-width="1.4" opacity=".8">
            <line x1="516" y1="354" x2="516" y2="454"/>
            <line x1="516" y1="354" x2="516" y2="454" transform="rotate(30 516 404)"/>
            <line x1="516" y1="354" x2="516" y2="454" transform="rotate(60 516 404)"/>
            <line x1="516" y1="354" x2="516" y2="454" transform="rotate(90 516 404)"/>
            <line x1="516" y1="354" x2="516" y2="454" transform="rotate(120 516 404)"/>
            <line x1="516" y1="354" x2="516" y2="454" transform="rotate(150 516 404)"/>
            <circle cx="516" cy="352" r="3.2" fill="#ff9068" stroke="none"/>
          </g>
          <circle cx="516" cy="404" r="7" fill="#93a6b4"/>
        </g>

        <!-- 链条 -->
        <g fill="none" stroke="#5d6c79" stroke-width="2.4" stroke-dasharray="4 4" id="chain">
          <path d="M408 398 L318 393"/>
          <path d="M408 450 L318 415"/>
        </g>
        <circle cx="318" cy="404" r="10" fill="#2c3742" stroke="#9fb2c0" stroke-width="1.5"/>

        <!-- 车架 -->
        <g fill="none" stroke="#e2593f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M318 404 L408 424"/>
          <path d="M318 404 L382 334"/>
          <path d="M408 424 L388 340"/>
          <path d="M408 424 L504 350"/>
          <path d="M386 334 L498 320"/>
          <path d="M498 320 L510 354"/>
          <path d="M510 354 C 514 372 516 388 516 404"/>
        </g>

        <!-- 车座 -->
        <path d="M386 334 C 398 326 420 324 432 330 C 424 340 406 346 390 344 C 382 343 382 338 386 334 Z"
              fill="#4b3a2c" stroke="#38291d" stroke-width="2" stroke-linejoin="round"/>

        <!-- 车把 -->
        <g fill="none" stroke="#2f3943" stroke-width="7" stroke-linecap="round">
          <path d="M498 320 L490 302"/>
          <path d="M464 300 C 478 290 500 290 512 302"/>
        </g>
        <circle cx="512" cy="302" r="5.5" fill="#1d242b"/>

        <!-- 牙盘 -->
        <circle cx="408" cy="424" r="26" fill="none" stroke="#b9c9d5" stroke-width="2.5" stroke-dasharray="3 4"/>
        <circle cx="408" cy="424" r="19" fill="#2c3742"/>
        <circle cx="408" cy="424" r="8" fill="#8ea3b2"/>

        <!-- 曲柄与脚踏 -->
        <line id="crankFar" x1="408" y1="424" x2="380" y2="410" stroke="#2b333b" stroke-width="7" stroke-linecap="round"/>
        <line id="crankNear" x1="408" y1="424" x2="436" y2="438" stroke="#2b333b" stroke-width="7" stroke-linecap="round"/>
        <g id="pedalFar">
          <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#39434d" stroke="#1f262d" stroke-width="1"/>
        </g>
        <g id="pedalNear">
          <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#39434d" stroke="#1f262d" stroke-width="1"/>
        </g>

        <!-- 尾羽 -->
        <path d="M322 266 C 302 260 284 263 270 274 C 282 283 298 290 316 291 Z"
              fill="url(#wing)" stroke="#b9c8d3" stroke-width="1.5"/>

        <!-- 远侧腿 -->
        <path id="legFar" d="M374 336 L404 380 L418 416" fill="none" stroke="#c9781f" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round"/>
        <g id="footFar" transform="translate(418 412)">
          <path d="M-10 0 C -3 -3 6 -3 11 0 L 14 6 C 6 9 -5 9 -13 6 Z" fill="#d9852c"/>
          <path d="M-3 1 L-5 6 M4 0.5 L5 6" stroke="#b96a19" stroke-width="1" fill="none" opacity=".7"/>
        </g>

        <!-- 身体 -->
        <ellipse cx="372" cy="282" rx="64" ry="52" transform="rotate(-8 372 282)"
                 fill="url(#body)" stroke="#c7d5df" stroke-width="1.5"/>

        <!-- 翅膀 -->
        <g id="wing">
          <path d="M404 250 C 378 250 348 262 326 282 C 330 296 348 304 368 300 C 394 294 410 274 414 258 Z"
                fill="url(#wing)" stroke="#b9c8d3" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M390 274 C 376 282 360 288 342 290" fill="none" stroke="#a9bac6" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M384 288 C 372 293 358 297 346 297" fill="none" stroke="#a9bac6" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- 近侧腿 -->
        <path id="legNear" d="M380 332 L412 378 L430 420" fill="none" stroke="#f6a95c" stroke-width="11.5"
              stroke-linecap="round" stroke-linejoin="round"/>
        <g id="footNear" transform="translate(430 416)">
          <path d="M-11 0 C -3 -3 7 -3 13 0 L 16 6 C 7 10 -5 10 -14 6 Z"
                fill="#f6a95c" stroke="#cf7a24" stroke-width="1.4"/>
          <path d="M-3 1 L-5 7 M4 0.5 L5 7" stroke="#cf7a24" stroke-width="1" fill="none" opacity=".75"/>
        </g>

        <!-- 脖子 -->
        <path d="M402 264 C 408 234 418 212 436 202" fill="none" stroke="url(#neckG)"
              stroke-width="34" stroke-linecap="round"/>

        <g id="headBob">
          <!-- 头 -->
          <ellipse cx="442" cy="192" rx="28" ry="25" transform="rotate(-8 442 192)"
                   fill="url(#body)" stroke="#c7d5df" stroke-width="1.5"/>
          <!-- 头顶小羽冠 -->
          <path d="M424 170 C 418 160 420 152 429 149 C 427 158 430 163 435 167 Z" fill="#eef4f8" stroke="#cddae3" stroke-width="1.2"/>
          <!-- 喙 -->
          <path d="M456 176 C 490 172 540 182 574 198 C 582 202 584 210 576 211
                   C 534 200 492 194 458 194 Z"
                fill="url(#beak)" stroke="#d98a1e" stroke-width="1.5" stroke-linejoin="round"/>
          <!-- 喉囊 -->
          <path d="M458 192 C 468 228 496 250 524 246 C 546 243 562 224 574 210
                   C 540 218 496 210 458 192 Z"
                fill="url(#pouch)" stroke="#dd8f24" stroke-width="1.5" stroke-linejoin="round"/>
          <path d="M482 214 C 492 227 503 233 515 234" fill="none" stroke="#e09a33" stroke-width="1.2" opacity=".65"/>
          <path d="M500 209 C 510 221 522 227 534 227" fill="none" stroke="#e09a33" stroke-width="1.2" opacity=".55"/>
          <!-- 鼻孔 -->
          <ellipse cx="476" cy="186" rx="4" ry="2.2" fill="#c47b17" opacity=".7"/>
          <!-- 眼睛 -->
          <circle cx="452" cy="184" r="8" fill="#ffffff" stroke="#d6e2ea" stroke-width="1"/>
          <circle cx="453.5" cy="184" r="4.6" fill="#1c2733"/>
          <circle cx="455.2" cy="182.2" r="1.5" fill="#ffffff"/>
        </g>
      </g>
    </svg>
  </div>
  <div class="caption">
    <b>鹈鹕 · 海岸公路</b>
    <span class="hint" id="hint">点击画面 / 按空格：暂停 · 继续</span>
  </div>
</div>

<script>
(function () {
  'use strict';

  var svg = document.getElementById('scene');
  var hint = document.getElementById('hint');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var spokesRear = document.getElementById('spokesRear');
  var spokesFront = document.getElementById('spokesFront');
  var crankNear = document.getElementById('crankNear');
  var crankFar = document.getElementById('crankFar');
  var pedalNear = document.getElementById('pedalNear');
  var pedalFar = document.getElementById('pedalFar');
  var footNear = document.getElementById('footNear');
  var footFar = document.getElementById('footFar');
  var legNear = document.getElementById('legNear');
  var legFar = document.getElementById('legFar');
  var chain = document.getElementById('chain');
  var bike = document.getElementById('bike');
  var headBob = document.getElementById('headBob');
  var wing = document.getElementById('wing');

  var BB = { x: 408, y: 424 };
  var HIP = { x: 380, y: 332 };
  var CRANK_R = 30;
  var L1 = 66, L2 = 78;
  var CADENCE = 2.3;      // 曲柄角速度 rad/s
  var GEAR = 2.35;        // 传动比

  var crankAngle = 0.55;
  var wheelDeg = 24;
  var t = 0;
  var paused = reduce;
  var last = performance.now();
  var needsDraw = true;

  document.body.classList.toggle('is-paused', paused);

  function kneeOf(hip, pedal) {
    var dx = pedal.x - hip.x;
    var dy = pedal.y - hip.y;
    var raw = Math.hypot(dx, dy) || 1;
    var d = Math.min(Math.max(raw, Math.abs(L1 - L2) + 1), L1 + L2 - 1);
    var ux = dx / raw, uy = dy / raw;
    var a = (d * d + L1 * L1 - L2 * L2) / (2 * d);
    var h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    var bx = hip.x + ux * a;
    var by = hip.y + uy * a;
    var px = -uy, py = ux;
    if (px < 0) { px = -px; py = -py; }   // 膝盖朝前
    return { x: bx + px * h, y: by + py * h };
  }

  function legD(hip, knee, pedal) {
    return 'M' + hip.x + ' ' + hip.y +
           ' L' + knee.x.toFixed(1) + ' ' + knee.y.toFixed(1) +
           ' L' + pedal.x.toFixed(1) + ' ' + (pedal.y - 6).toFixed(1);
  }

  function draw() {
    var c = Math.cos(crankAngle), s = Math.sin(crankAngle);
    var pNear = { x: BB.x + CRANK_R * c, y: BB.y + CRANK_R * s };
    var pFar  = { x: BB.x - CRANK_R * c, y: BB.y - CRANK_R * s };

    spokesRear.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ' 318 404)');
    spokesFront.setAttribute('transform', 'rotate(' + wheelDeg.toFixed(2) + ' 516 404)');

    crankNear.setAttribute('x2', pNear.x.toFixed(1));
    crankNear.setAttribute('y2', pNear.y.toFixed(1));
    crankFar.setAttribute('x2', pFar.x.toFixed(1));
    crankFar.setAttribute('y2', pFar.y.toFixed(1));

    pedalNear.setAttribute('transform', 'translate(' + pNear.x.toFixed(1) + ' ' + pNear.y.toFixed(1) + ')');
    pedalFar.setAttribute('transform', 'translate(' + pFar.x.toFixed(1) + ' ' + pFar.y.toFixed(1) + ')');

    var kNear = kneeOf(HIP, pNear);
    var kFar = kneeOf({ x: HIP.x - 7, y: HIP.y + 3 }, pFar);
    legNear.setAttribute('d', legD(HIP, kNear, pNear));
    legFar.setAttribute('d', legD({ x: HIP.x - 7, y: HIP.y + 3 }, kFar, pFar));

    footNear.setAttribute('transform', 'translate(' + pNear.x.toFixed(1) + ' ' + (pNear.y - 6).toFixed(1) + ')');
    footFar.setAttribute('transform', 'translate(' + pFar.x.toFixed(1) + ' ' + (pFar.y - 6).toFixed(1) + ')');

    chain.setAttribute('stroke-dashoffset', (-crankAngle * 12).toFixed(2));

    var bob = Math.sin(t * 5.2) * 1.4;
    bike.setAttribute('transform', 'translate(0 ' + bob.toFixed(2) + ')');
    headBob.setAttribute('transform', 'rotate(' + (Math.sin(t * 4.4) * 2.2).toFixed(2) + ' 428 244)');
    wing.setAttribute('transform', 'rotate(' + (Math.sin(t * 3.1 + 0.8) * 3).toFixed(2) + ' 404 250)');
  }

  function tick(now) {
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      t += dt;
      crankAngle += CADENCE * dt;
      wheelDeg += CADENCE * GEAR * dt * 57.2957795;
      needsDraw = true;
    }
    if (needsDraw) {
      draw();
      needsDraw = false;
    }
    requestAnimationFrame(tick);
  }

  function toggle() {
    paused = !paused;
    document.body.classList.toggle('is-paused', paused);
    hint.textContent = paused ? '已暂停 · 点击继续' : '点击画面 / 按空格：暂停 · 继续';
    needsDraw = true;
    last = performance.now();
  }

  svg.addEventListener('click', toggle);
  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ') {
      e.preventDefault();
      toggle();
    }
  });

  draw();
  requestAnimationFrame(tick);
})();
